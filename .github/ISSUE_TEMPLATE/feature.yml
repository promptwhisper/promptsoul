name: Feature request
description: 提议一个与 PromptSoul 目标和安全边界一致的改进。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景和当前限制，不要只给出功能名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明交互、数据流和预期行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: textarea
    id: safety-license
    attributes:
      label: 安全与许可证影响
      description: 是否涉及 API Key、Provider 数据、模型导入、动作写入、第三方 SDK、模型或截图？
    validations:
      required: true

  - type: checkboxes
    id: guardrails
    attributes:
      label: 项目边界
      options:
        - label: 该建议不会要求在 Git 中提交真实 API Key 或授权受限模型。
          required: true
        - label: 如果涉及动作生成，方案只写入 `PromptSoul`，不覆盖模型原有动作组。
          required: true
